name: Deploy ddd4j-ai to Aliyun Maven repository

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy from
        required: true
        type: choice
        default: 'master'
        options:
          - 'master'
      repository:
        description: Target Aliyun repository
        required: true
        type: choice
        default: 'snapshot'
        options:
          - 'snapshot'
          - 'release'
      dry_run:
        description: Dry run (only show what would be deployed)
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Aliyun
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate inputs
        run: |
          echo "Deploying branch: ${{ inputs.branch || 'master' }}"
          echo "Target repository: ${{ inputs.repository || 'snapshot' }}"
          echo "Dry run: ${{ inputs.dry_run }}"

      - name: Determine ref
        id: ref
        run: |
          REF="${{ inputs.branch }}"
          if [ -z "$REF" ]; then REF="master"; fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Determine target repository
        id: repo
        run: |
          if [ -n "${{ inputs.repository }}" ]; then
            REPO="${{ inputs.repository }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            REPO="release"
          else
            REPO="snapshot"
          fi
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: 'maven'
          overwrite-settings: true

      - name: Configure Easy4J Maven repositories
        env:
          MAVEN_SETTINGS_XML: ${{ secrets.MAVEN_SETTINGS_XML }}
          ALIYUN_USER: ${{ secrets.ALIYUN_PACKAGES_USERNAME }}
          ALIYUN_PASS: ${{ secrets.ALIYUN_PACKAGES_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$MAVEN_SETTINGS_XML" ]; then
            echo "::error::Repository secret MAVEN_SETTINGS_XML is not configured (base64 of ~/.m2/settings.xml with Aliyun server credentials)." >&2
            exit 1
          fi
          install -d -m 700 "$HOME/.m2"
          umask 077
          printf '%s' "$MAVEN_SETTINGS_XML" | base64 --decode > "$HOME/.m2/settings.xml"
          REPO="${{ steps.repo.outputs.repo }}"
          if [ "$REPO" == "release" ]; then
            REPO_URL="2624322-release-6f6h6r"
          else
            REPO_URL="2624322-snapshot-3eoov3"
          fi
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -u "$ALIYUN_USER:$ALIYUN_PASS" \
            "https://packages.aliyun.com/6927b116e6c3e0425dbdf60d/maven/${REPO_URL}/io/ddd4j/ddd4j-parent/3.0.x.20260630-SNAPSHOT/maven-metadata.xml" || echo curl-failed)
          echo "Aliyun ${REPO} credential check: HTTP $HTTP_CODE (user len ${#ALIYUN_USER})"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Aliyun ${REPO} auth failed (HTTP $HTTP_CODE)" >&2
            exit 1
          fi

      - name: Install reactor artifacts
        run: ./mvnw -U -Denforcer.skip=true -B -DskipTests install

      - name: Deploy to Aliyun
        shell: bash
        run: |
          DRY_RUN_ARG=""
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            DRY_RUN_ARG="-DdryRun=true"
            echo "::notice::Dry run mode — no artifacts will be deployed"
          fi
          REPO="${{ steps.repo.outputs.repo }}"
          # 验证版本号与目标仓库匹配：
          #   snapshot 阶段：版本必须包含 -SNAPSHOT
          #   release 阶段：版本必须不包含 -SNAPSHOT
          VERSION=$(./mvnw -q -B -N help:evaluate -Dexpression=project.version -DforceStdout 2>/dev/null | tail -1)
          echo "Project version: $VERSION"
          if [ "$REPO" == "snapshot" ] && [[ "$VERSION" != *-SNAPSHOT ]]; then
            echo "::error::Repository is 'snapshot' but version $VERSION is not a -SNAPSHOT" >&2
            exit 1
          fi
          if [ "$REPO" == "release" ] && [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "::error::Repository is 'release' but version $VERSION is still -SNAPSHOT" >&2
            echo "::error::To deploy a release, first run a release version bump commit" >&2
            exit 1
          fi
          # 全 reactor 部署；samples / sample-app 已配置 maven.deploy.skip=true 自动跳过
          ./mvnw -U -Denforcer.skip=true -B $DRY_RUN_ARG -DskipTests deploy
