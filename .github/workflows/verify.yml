name: Verify ddd4j-ai

on:
  push:
    branches:
      - master
      - feature/**
  pull_request:

permissions:
  contents: read

jobs:
  workflow-lint:
    name: GitHub Actions workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow syntax
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check
          fail_level: error

  unit-and-contract:
    name: Java 21 unit and contract (Maven 4)
    runs-on: ubuntu-latest
    needs: workflow-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          overwrite-settings: true
      - name: Configure Easy4J Maven repositories
        env:
          MAVEN_SETTINGS_XML: ${{ secrets.MAVEN_SETTINGS_XML }}
          ALIYUN_USER: ${{ secrets.ALIYUN_PACKAGES_USERNAME }}
          ALIYUN_PASS: ${{ secrets.ALIYUN_PACKAGES_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$MAVEN_SETTINGS_XML" ]; then
            echo "::error::Repository secret MAVEN_SETTINGS_XML is not configured (base64 of ~/.m2/settings.xml with Aliyun server credentials)." >&2
            exit 1
          fi
          install -d -m 700 "$HOME/.m2"
          umask 077
          printf '%s' "$MAVEN_SETTINGS_XML" | base64 --decode > "$HOME/.m2/settings.xml"
          # 凭据连通性自检（直接用 secrets，避免解析 settings）
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -u "$ALIYUN_USER:$ALIYUN_PASS" \
            "https://packages.aliyun.com/6927b116e6c3e0425dbdf60d/maven/2624322-snapshot-3eoov3/io/ddd4j/ddd4j-parent/3.0.x.20260630-SNAPSHOT/maven-metadata.xml" || echo curl-failed)
          echo "credential check: HTTP $HTTP_CODE (user len ${#ALIYUN_USER})"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Aliyun auth returned $HTTP_CODE - private snapshot deps (ddd4j-parent / ddd4j-boot-dependencies) may fail to resolve"
          fi
      - name: Verify Docker daemon (Testcontainers prerequisite)
        run: docker info
      # 单测 + 契约 + 装配测试 + 基础设施容器集成（PostgreSQL / Redis Stack / pgvector，镜像小而稳）。
      # Ollama 真实模型链路（需容器内拉取模型，偶发超时）拆到 ai-model-integration 容错执行。
      - name: Run unit, contract and infrastructure integration tests
        run: >-
          ./mvnw -U -Denforcer.skip=true -B -DskipTests=false
          -Dtest='!OllamaChatIntegrationTest,!OllamaEmbeddingIntegrationTest,!RagSmokeIntegrationTest'
          -Dsurefire.failIfNoSpecifiedTests=false
          test

  ai-model-integration:
    name: Ollama real-model integration (tolerant)
    runs-on: ubuntu-latest
    needs: [workflow-lint, unit-and-contract]
    # Ollama 容器内拉取 qwen2.5:0.5b / all-minilm 受网络波动影响，偶发超时与代码无关，允许失败不阻塞 CI
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          overwrite-settings: true
      - name: Configure Easy4J Maven repositories
        env:
          MAVEN_SETTINGS_XML: ${{ secrets.MAVEN_SETTINGS_XML }}
        shell: bash
        run: |
          install -d -m 700 "$HOME/.m2"
          umask 077
          printf '%s' "$MAVEN_SETTINGS_XML" | base64 --decode > "$HOME/.m2/settings.xml"
          grep -q "2624322-snapshot-3EoOv3" "$HOME/.m2/settings.xml"
      - name: Verify Docker daemon
        run: docker info
      # 真实模型全链路：chat（qwen2.5:0.5b 单轮/多轮/流式/AiHandler）+ embedding（all-minilm）+ RAG 联合冒烟（1.0.x 线为 Boot3.4/FW6.2 基线，真实模型链路按 classpath 探测跳过，此 job 为 CI 前向占位）
      - name: Run Ollama real-model integration tests
        run: >-
          ./mvnw -U -Denforcer.skip=true -B -DskipTests=false
          -Dtest='OllamaChatIntegrationTest,OllamaEmbeddingIntegrationTest,RagSmokeIntegrationTest'
          -Dsurefire.failIfNoSpecifiedTests=false
          -pl ddd4j-ai-extensions/ddd4j-ai-extension-chat,ddd4j-ai-extensions/ddd4j-ai-extension-embedding,ddd4j-ai-extensions/ddd4j-ai-extension-rag
          -am
          test
